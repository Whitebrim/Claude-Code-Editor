[package]
name = "claude-code-editor"
version = "0.1.0"
edition = "2021"
description = "GUI editor for Claude Code / Claude Desktop session JSONL files: browse projects, edit assistant / user / attachment messages, delete or insert records, keep parent-uuid chains intact."
license = "MIT"
repository = "https://github.com/Whitebrim/Claude-Code-Editor"
authors = ["Whitebrim"]
readme = "README.md"
keywords = ["claude", "claude-code", "editor", "jsonl", "gui"]
categories = ["command-line-utilities", "gui"]

[[bin]]
name = "claude-code-editor"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rfd = "0.15"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
lto = "thin"
codegen-units = 1
